<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photoshop Workflow Manager</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- BARRE DE TITRE (macOS style) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <header class="titlebar">
    <div class="titlebar-drag">
      <span class="app-title">Photoshop Workflow Manager</span>
      <span class="app-version">v1.0.0</span>
    </div>
    <div class="titlebar-actions">
      <button class="btn-icon" id="btn-refresh" title="Rafraîchir (⌘R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-folder" title="Ouvrir le dossier utilisateur">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-settings" title="Éditer la configuration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- CONTAINER PRINCIPAL -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <main class="main-container">
    
    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <!-- BARRE LATÉRALE GAUCHE (Unités + Outils communs) -->
    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <aside class="sidebar-left">
      
      <div class="sidebar-section">
        <div class="unit-buttons" id="unit-buttons">
          <button class="unit-btn" data-unit="pt">pt</button>
          <button class="unit-btn active" data-unit="mm">mm</button>
          <button class="unit-btn" data-unit="cm">cm</button>
          <button class="unit-btn" data-unit="inch">Inch</button>
          <button class="unit-btn" data-unit="px">px</button>
        </div>
      </div>
      
      <div class="sidebar-divider"></div>
      
      <div class="sidebar-section">
        <div class="sidebar-title">Outils</div>
        <div class="tool-buttons" id="common-tools">
          <!-- Généré dynamiquement -->
        </div>
      </div>
      
      <div class="sidebar-spacer"></div>
      
    </aside>

    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <!-- ZONE CENTRALE -->
    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <div class="content-area">
      
      <!-- Onglets catégories -->
      <nav class="tabs-nav" id="category-tabs">
        <!-- Généré dynamiquement -->
      </nav>
      
      <!-- Zone de contenu avec sous-onglets -->
      <div class="content-panel">
        
        <!-- Sous-navigation (subcategories ou scripts) -->
        <div class="sub-tabs" id="sub-tabs">
          <!-- Généré dynamiquement -->
        </div>
        
        <!-- Panneau de paramètres -->
        <div class="params-panel" id="params-panel">
          
          <div class="params-header">
            <h2 class="params-title" id="script-title">Sélectionnez un script</h2>
            <p class="params-description" id="script-description"></p>
          </div>
          
          <div class="params-form" id="params-form">
            <!-- Paramètres générés dynamiquement -->
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
              </svg>
              <p>Sélectionnez un script dans la liste ci-dessus</p>
            </div>
          </div>
          
        </div>
        
      </div>
      
    </div>

    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <!-- PANNEAU DROIT (Presets) -->
    <!-- ─────────────────────────────────────────────────────────────────────── -->
    <aside class="sidebar-right">
      
      <div class="sidebar-section">
        <div class="sidebar-title">Presets</div>
        <div class="presets-list" id="presets-list">
          <div class="empty-presets">Aucun preset</div>
        </div>
        <button class="btn-add-preset" id="btn-save-preset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Sauvegarder
        </button>
      </div>
      
    </aside>

  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- BARRE D'ACTIONS (footer) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <footer class="action-bar">
    <div class="action-bar-left">
      <label class="batch-toggle">
        <input type="checkbox" id="batch-mode">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Mode Batch</span>
      </label>
      <div class="batch-folders" id="batch-folders" style="display: none;">
        <button class="btn-folder" id="btn-input-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
          </svg>
          <span id="input-folder-label">Dossier source...</span>
        </button>
        <button class="btn-folder" id="btn-output-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            <path d="M12 11v6M9 14l3 3 3-3"/>
          </svg>
          <span id="output-folder-label">Dossier sortie...</span>
        </button>
      </div>
    </div>
    <div class="action-bar-right">
      <button class="btn-secondary" id="btn-cancel">Annuler</button>
      <button class="btn-primary" id="btn-run" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Exécuter
      </button>
    </div>
  </footer>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- MODAL PRESET -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Sauvegarder le preset</h3>
        <button class="btn-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="preset-name">Nom du preset</label>
          <input type="text" id="preset-name" class="input-field" placeholder="Mon preset...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel">Annuler</button>
        <button class="btn-primary" id="modal-save">Sauvegarder</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- TOAST NOTIFICATIONS -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div class="toast-container" id="toast-container"></div>

  <script src="scripts/renderer.js"></script>
</body>
</html>
